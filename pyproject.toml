[project]
name = "concentrate"
version = "0.1.0"
description = "Context-compression engine for AI agents, built on Granola meeting notes (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "anthropic>=2.3.0",
  "mcp>=2.3.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=6.2.0",
  "mem0ai[nlp]>=2.2.1",
  "en-core-web-sm",
  "fastembed>=0.3.1",
]

[project.scripts]
concentrate = "concentrate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/concentrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["concentrate", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/concentrate/core", "packages/concentrate/sources", "packages/concentrate/llm", "packages/concentrate/synth", "packages/concentrate/agents", "packages/concentrate/evals", "packages/concentrate/cli.py"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "sentence_transformers", "mem0", "mem0.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
