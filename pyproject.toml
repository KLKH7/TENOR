[project]
name = "concentrate"
version = "0.1.0"
description = "Context-compression engine for AI agents, built on Granola meeting notes (research prototype)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "anthropic>=2.3.0",
]

[project.scripts]
concentrate = "concentrate.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/concentrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
timeout = 20

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["concentrate", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/concentrate/core", "packages/concentrate/sources", "packages/concentrate/llm", "packages/concentrate/synth", "packages/concentrate/cli.py"]
