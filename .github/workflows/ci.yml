name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung job fails loudly instead of burning hours (see docs/HARDENING.md)
    env:
      # Tests never touch the network or need secrets; make sure nothing can reach a real API.
      ANTHROPIC_API_KEY: ""
      GRANOLA_API_KEY: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.11 and dependencies (locked)
        run: |
          uv python install 3.11
          uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
