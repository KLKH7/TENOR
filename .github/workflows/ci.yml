name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung job fails loudly instead of burning hours (see docs/engineering/HARDENING.md)
    env:
      # Tests never touch the network or need secrets; make sure nothing can reach a real API.
      ANTHROPIC_API_KEY: ""
      GRANOLA_API_KEY: ""
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.11 and dependencies (locked)
        run: |
          uv python install 3.11
          uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Docs links resolve
        run: uv run python scripts/check_links.py
      # Every figure's inputs are committed: the synthetic reports under evals/, plus
      # docs/figures/data/real_slice.json, a content-free snapshot of the private real slice
      # (refreshed locally with --refresh-real; CI never sees data/real). Plotted values
      # (docs/figures/data/*.values.json) must match exactly; SVGs are compared structurally,
      # since font metrics differ between macOS and Linux.
      - name: Figures match committed data
        run: uv run tenor figures 20261103T002456Z --check
