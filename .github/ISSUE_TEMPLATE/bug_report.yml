name: Bug report
description: Something doesn't run, a test fails, or a number looks wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't paste API keys, `.env` contents or real meeting data. For a security issue or leaked data, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command and the relevant output or traceback.
      render: shell
    validations:
      required: true
  - type: input
    id: sha
    attributes:
      label: Git SHA
      description: "`git rev-parse --short HEAD`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, `uv --version`
  - type: textarea
    id: report
    attributes:
      label: Report (if it's about a result)
      description: The report stamp under `evals/reports/`, system, question ID, and the fixture set and generator version.
