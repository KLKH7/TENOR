  <g id="text_26">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: start; fill: #222222" x="5.76" y="14.734125" transform="rotate(-0 5.76 14.734125)">When the answer isn't right, does it say so?</text>
  </g>
  <g id="text_27">
   <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 25.991473)">Author's 4 real meetings, 47 questions, DEV (seen during development); run 20261104T012414Z.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 36.793934)">Granola's four answer types, from the judge's verdict and whether the answer hedged.</text>
  </g>
  <g id="text_28">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 265.667156)">Mapping: complete = judged correct; incomplete = judged partially correct; says so = judged incorrect but abstained or said the material</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 275.269344)">doesn't cover it; wrong but confident = judged incorrect with no hedge. Granola's confident errors were 2 of 6 unanswerable questions.</text>
  </g>
