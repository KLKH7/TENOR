  </g>
  <g id="text_25">
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 317.742781)">Capture: share of 15 s windows of AMI speech found in the app's transcript (windows cluster by meeting, so the whisker is the per-meeting</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 327.344969)">range, not a CI). Notes: first automated grounding pass; claims differ between apps, so no paired test. Answers: our reader over each app's</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 336.947156)">own notes, judged against AMI's human summaries; paired sign test on the same questions. Granola-only measures (Chat answers) are</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; fill: #666666" transform="translate(5.76 346.549344)">omitted here.</text>
  </g>
